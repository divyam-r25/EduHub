<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo" onclick="switchScreen('home')">📚 EduHub</div>
            <div class="search-bar">
                <input type="text" placeholder="Search questions..." id="searchInput">
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="toggleSearch()">🔍</button>
            <button class="icon-btn" style="position: relative;">
                🔔
                <span class="notification-badge" id="notificationCount">0</span>
            </button>
            <button class="icon-btn" onclick="switchScreen('profile')">👤</button>
        </div>
    </div>

    <div class="container main-content">
        <div id="home" class="screen active">
            <div class="subject-chips" id="subjectChips"></div>
            <div id="questionsFeed"></div>
            <button class="btn btn-secondary btn-full" onclick="loadMoreQuestions()" style="margin-top: 20px;">Load More Questions</button>
        </div>

        <div id="askQuestion" class="screen">
            <div class="progress-indicator">
                <div class="progress-step active" id="step1">1</div>
                <div class="progress-line active" id="progressLine1"></div>
                <div class="progress-step" id="step2">2</div>
                <div class="progress-line" id="progressLine2"></div>
                <div class="progress-step" id="step3">3</div>
                <span style="margin-left: auto; color: var(--text-lighter);" id="stepLabel">Step 1/3</span>
            </div>

            <div id="step1Content" class="step-content">
                <h2 style="font-size: 20px; margin-bottom: 16px;">What's your question?</h2>
                <div class="form-group">
                    <label class="form-label">Question Title (Be specific)</label>
                    <input type="text" class="form-input" id="questionTitle" placeholder="e.g., How do I solve quadratic equations?" maxlength="150">
                </div>
                <div class="form-group">
                    <label class="form-label">Explain more... (optional)</label>
                    <textarea class="form-textarea" id="questionDescription" placeholder="What have you tried? Share any errors or details..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Upload Image (optional)</label>
                    <input type="file" class="form-input" id="questionImage" accept="image/*">
                </div>
                <button class="btn btn-primary btn-full" onclick="nextStep()">Next Step →</button>
            </div>

            <div id="step2Content" class="step-content hidden">
                <h2 style="font-size: 20px; margin-bottom: 16px;">Choose subject & topic</h2>
                <div class="form-group">
                    <label class="form-label">Subject</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="Mathematics" id="math">
                            <label for="math">📐 Mathematics</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="Physics" id="physics">
                            <label for="physics">🔬 Physics</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="Chemistry" id="chemistry">
                            <label for="chemistry">🧪 Chemistry</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="Biology" id="biology">
                            <label for="biology">🦠 Biology</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="History" id="history">
                            <label for="history">📖 History</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" name="subject" value="Programming" id="programming">
                            <label for="programming">💻 Programming</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Difficulty Level</label>
                    <div class="radio-group" style="flex-direction: column; gap: 8px;">
                        <div class="radio-item">
                            <input type="radio" name="difficulty" value="Easy" id="easy">
                            <label for="easy">Easy</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" name="difficulty" value="Medium" id="medium">
                            <label for="medium">Medium</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" name="difficulty" value="Hard" id="hard">
                            <label for="hard">Hard</label>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="btn btn-secondary" style="flex: 1;" onclick="prevStep()">← Back</button>
                    <button class="btn btn-primary" style="flex: 1;" onclick="nextStep()">Next Step →</button>
                </div>
            </div>

            <div id="step3Content" class="step-content hidden">
                <h2 style="font-size: 20px; margin-bottom: 16px;">Review before posting</h2>
                <div class="answer-card">
                    <div class="question-title" id="reviewTitle">Your Question Title</div>
                    <div class="question-preview" id="reviewDescription">Your description will appear here</div>
                    <div class="question-meta" style="margin-top: 12px;">
                        <span id="reviewSubject">Subject: Not selected</span>
                        <span id="reviewDifficulty">Difficulty: Not selected</span>
                    </div>
                </div>

                <div style="margin-top: 16px;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="agreeCheckbox" checked>
                        <span style="font-size: 14px;">I understand community guidelines</span>
                    </label>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="btn btn-secondary" style="flex: 1;" onclick="prevStep()">← Back</button>
                    <button class="btn btn-primary" style="flex: 1;" onclick="postQuestion()">Post Question</button>
                </div>
            </div>
        </div>

        <div id="questionDetail" class="screen">
            <button class="btn btn-secondary btn-sm" onclick="switchScreen('home')" style="margin-bottom: 16px;">← Back</button>
            
            <div id="detailContent"></div>

            <div class="mt-16">
                <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">ANSWERS</h3>
                <div id="answersList"></div>

                <h3 style="font-size: 16px; font-weight: 700; margin: 20px 0 12px;">YOUR ANSWER</h3>
                <div class="form-group">
                    <textarea class="form-textarea" id="answerInput" placeholder="Write your answer here..."></textarea>
                </div>
                <button class="btn btn-primary btn-full" onclick="postAnswer()">Post Your Answer</button>
            </div>
        </div>

        <div id="profile" class="screen">
            <div id="profileContent"></div>
        </div>

        <div id="browse" class="screen">
            <div class="search-bar" style="margin-bottom: 16px;">
                <input type="text" placeholder="Search by subject, keyword..." id="browseSearch" onkeyup="filterQuestions()">
            </div>
            <div id="browseContent"></div>
        </div>

        <div id="saved" class="screen">
            <div id="savedContent"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('home')">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchScreen('browse')">
            <span class="nav-icon">📂</span>
            <span>Browse</span>
        </button>
        <button class="nav-item" onclick="switchScreen('askQuestion')">
            <span class="nav-icon">➕</span>
            <span>Ask</span>
        </button>
        <button class="nav-item" onclick="switchScreen('saved')">
            <span class="nav-icon">📚</span>
            <span>Saved</span>
        </button>
        <button class="nav-item" onclick="switchScreen('profile')">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
